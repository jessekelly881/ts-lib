name: Check
on:
    workflow_dispatch:
    pull_request:
        branches: [main]
    push:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: Build
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7.0.1
            - name: Install dependencies
              id: setup
              uses: ./.github/actions/setup
            - name: Build library
              if: steps.setup.outputs.has-source == 'true'
              run: pnpm build
            - name: Report empty source tree
              if: steps.setup.outputs.has-source != 'true'
              run: echo "Build skipped because src contains no source files." >> "$GITHUB_STEP_SUMMARY"

    types:
        name: Types
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v7.0.1
            - name: Install dependencies
              id: setup
              uses: ./.github/actions/setup
            - run: pnpm check

    lint:
        name: Lint
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v7.0.1
            - name: Install dependencies
              id: setup
              uses: ./.github/actions/setup
            - name: Lint source
              if: steps.setup.outputs.has-source == 'true'
              run: pnpm lint
            - name: Check circular dependencies
              if: steps.setup.outputs.has-source == 'true'
              run: pnpm circular
            - name: Report empty source tree
              if: steps.setup.outputs.has-source != 'true'
              run: echo "Source lint and circular dependency checks skipped because src contains no source files." >> "$GITHUB_STEP_SUMMARY"

    test:
        name: Test (${{ matrix.runtime }})
        runs-on: ubuntu-latest
        timeout-minutes: 5
        strategy:
            fail-fast: false
            matrix:
                runtime: [Node, Bun]
        steps:
            - uses: actions/checkout@v7.0.1
            - name: Install dependencies
              id: setup
              uses: ./.github/actions/setup
            - uses: oven-sh/setup-bun@v2.2.0
              if: matrix.runtime == 'Bun' && steps.setup.outputs.has-tests == 'true'
              with:
                  bun-version: 1.4.3
            - name: Test
              run: pnpm vitest run
              if: matrix.runtime == 'Node' && steps.setup.outputs.has-tests == 'true'
            - name: Test
              run: bun run vitest run
              if: matrix.runtime == 'Bun' && steps.setup.outputs.has-tests == 'true'

            - name: Report missing tests
              if: steps.setup.outputs.has-tests != 'true'
              run: echo "Tests skipped because no test files exist. No application behavior was validated." >> "$GITHUB_STEP_SUMMARY"

    analyze:
        name: Analyze
        runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
        timeout-minutes: ${{ (matrix.language == 'swift' && 120) || 360 }}
        permissions:
            security-events: write
            actions: read
            contents: read

        strategy:
            fail-fast: false
            matrix:
                language: ["javascript-typescript"]

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7.0.1
            - name: Initialize CodeQL
              uses: github/codeql-action/init@v4.38.3
              with:
                  languages: ${{ matrix.language }}
                  queries: security-extended

            - name: Autobuild
              uses: github/codeql-action/autobuild@v4.38.3
            - name: Perform CodeQL Analysis
              uses: github/codeql-action/analyze@v4.38.3
              with:
                  category: "/language:${{matrix.language}}"
