name: Release
on:
    push:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}

jobs:
    release:
        name: Release
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: write
            id-token: write
            pull-requests: write
        steps:
            - uses: actions/checkout@v7.0.1
            - name: Install dependencies
              id: setup
              uses: ./.github/actions/setup
            - name: Build library
              if: steps.setup.outputs.has-source == 'true'
              run: pnpm run build
            - name: Create Release Pull Request or Publish
              if: steps.setup.outputs.has-source == 'true'
              uses: changesets/action@v2.1.2
              with:
                  publish: pnpm run publish
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
            - name: Report empty source tree
              if: steps.setup.outputs.has-source != 'true'
              run: echo "Release skipped because src contains no source files." >> "$GITHUB_STEP_SUMMARY"
